name: Publicar atualização do Voiz
on:
  push:
    tags: ['v*']
    branches: ['main']
    paths: ['app/**', 'setup/**', 'scripts/build-release.cjs', 'scripts/build-installer.cjs', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: voiz-release
  cancel-in-progress: true
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Testar
        run: node --test tests/*.test.cjs
      - name: Conferir arquivos públicos
        run: node scripts/audit-public.cjs
      - name: Montar pacote
        run: node scripts/build-release.cjs
      - name: Preparar compilador do instalador
        shell: pwsh
        run: |
          choco install nsis --version=3.11 --yes --no-progress --limit-output
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao instalar o compilador NSIS.' }
          'VOIZ_MAKENSIS=C:\Program Files (x86)\NSIS\makensis.exe' | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Montar instalador independente
        run: node scripts/build-installer.cjs
      - name: Conferir instalação isolada
        shell: pwsh
        run: |
          $version = (Get-Content app/package.json -Raw | ConvertFrom-Json).version
          ./tests/installer-smoke.ps1 -Installer "release/Voiz-$version-Setup.exe" -TestRoot $env:RUNNER_TEMP
      - name: Publicar no GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = (Get-Content app/package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { throw "A versão $tag já existe. Aumente app/package.json antes de publicar." }
          gh release create $tag release/* --target $env:GITHUB_SHA --title "Voiz $version" --notes "Adiciona Padrão do Windows em Soundboard > Ouvir em: o retorno dos efeitos acompanha o fone padrão do sistema e salva sua escolha. Quem usa um fone manualmente mantém sua seleção. Sons por clique e atalho usam a mesma opção; saídas coincidentes não duplicam o retorno. Atualiza também os atalhos existentes e a identidade da janela para Voiz, com ícone e comando próprios. Se um bloco antigo do menu Iniciar ainda mostrar Electron, desafixe-o e fixe novamente o Voiz pela pesquisa após atualizar. Inclui prévia privada ao desligar Enviar sons para a call, botão de teclado em cada som para configurar atalhos e Configurações na engrenagem. Busca atualizações ao abrir ou voltar à janela, com aviso na engrenagem e intervalo de cinco minutos. Para atualizar, abra Configurações > Atualizações no Voiz. Para instalar em outro PC, baixe Voiz-$version-Setup.exe. O instalador inclui Electron e VB-CABLE e prepara automaticamente o motor e as quatro vozes atuais. Sons e ajustes pessoais são preservados. Esta versão não inclui Seed-VC experimental nem muda os modelos de voz. A primeira instalação usa cerca de 2,2 GB de internet e requer 6 GB livres; autorize o Windows e reinicie se solicitado pelo driver. VB-CABLE é donationware: https://vb-audio.com/Cable/."
          if ($LASTEXITCODE -ne 0) { throw 'Não foi possível publicar a versão.' }
