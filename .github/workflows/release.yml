name: Publicar atualização do Voiz
on:
  push:
    tags: ['v*']
    branches: ['main']
    paths: ['app/**', 'scripts/build-release.cjs', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Testar
        run: node --test tests/*.test.cjs
      - name: Conferir arquivos públicos
        run: node scripts/audit-public.cjs
      - name: Montar pacote
        run: node scripts/build-release.cjs
      - name: Publicar no GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = (Get-Content app/package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { throw "A versão $tag já existe. Aumente app/package.json antes de publicar." }
          gh release create $tag release/* --target $env:GITHUB_SHA --title "Voiz $version" --notes "Atualização do Voiz para Windows. Seus sons, modelos e configurações locais são preservados. No aplicativo, abra Atualizações e procure esta versão."
          if ($LASTEXITCODE -ne 0) { throw 'Não foi possível publicar a versão.' }
